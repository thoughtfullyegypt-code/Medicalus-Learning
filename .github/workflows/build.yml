name: Build validation

on:
  push:
    branches: ["main", "rebuild/medalicus-product-from-zero"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements-processing.txt
      - run: python -m py_compile scripts/build_heart_acoustic_volume.py scripts/test_build_heart_acoustic_volume.py
      - run: python scripts/test_build_heart_acoustic_volume.py
